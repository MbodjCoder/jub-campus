name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest

    # Base PostgreSQL jetable : le client Prisma, les migrations, les tests
    # et le build (qui exécute `prisma migrate deploy`) en ont besoin.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Valeurs factices, suffisantes pour generate/migrate/typecheck/lint/test/build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-secret-build-uniquement-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm bdd:generer

      - name: Appliquer les migrations
        run: pnpm bdd:deployer

      - name: Vérification de types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test

      - name: Audit des dépendances de production
        run: pnpm audit:prod

      - name: Build de production
        run: pnpm build
